name: Release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate scripts
        run: |
          bash -n setup uninstall bin/whoop-widget
          python -m py_compile bin/whoop-bridge
      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v
          bash tests/test_setup.sh
      - name: Reject accidental sensitive files
        run: |
          if git ls-files | grep -E '(^|/)(\.env|config\.json|latest\.json|callback\.log)$'; then
            echo "Sensitive runtime file is tracked" >&2
            exit 1
          fi
